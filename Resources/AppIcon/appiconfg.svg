<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
    Ping My Network mark: a signal fan rising from this device, with three devices the scan found on
    the outer ring. Flat shapes only, so the MAUI resizer rasterizes it cleanly at every size.
    Centred on the 456 canvas; the build scales it into the adaptive-icon safe zone (ForegroundScale).
-->
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
    <g fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round">
        <!-- Inner and outer signal arcs, 45° to 135° around the centre dot. -->
        <path d="M 178.5 276.5 A 70 70 0 0 1 277.5 276.5" />
        <path d="M 129 227 A 140 140 0 0 1 327 227" />
    </g>
    <g fill="#FFFFFF">
        <!-- This device. -->
        <circle cx="228" cy="326" r="30" />
        <!-- Devices found on the network, on the 205-unit ring at 135°, 90° and 45°. -->
        <circle cx="83" cy="181" r="22" />
        <circle cx="228" cy="121" r="22" />
        <circle cx="373" cy="181" r="22" />
    </g>
</svg>
