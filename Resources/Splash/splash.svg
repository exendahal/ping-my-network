<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Splash: the launcher mark on the brand green (the background colour is set in the .csproj). -->
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
    <!-- On the app's 100-unit sketch grid, scaled to 75% of the canvas width. -->
    <defs>
        <!-- The pulse is cut out of the router, so it stays a hole in Android's single-colour themed icon. -->
        <mask id="pulse" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
            <rect x="0" y="0" width="100" height="100" fill="#FFFFFF" />
            <path d="M20 71 H37 L43 62 L50 80 L56 64 L61 71 H80" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
        </mask>
    </defs>
    <g transform="translate(15.5 -0.65) scale(4.25)">
        <rect x="10" y="56" width="80" height="30" rx="10" fill="#FFFFFF" mask="url(#pulse)" />
        <g fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round">
            <path d="M40 40 A14 14 0 0 1 60 40" />
            <path d="M30 30 A28 28 0 0 1 70 30" />
        </g>
    </g>
</svg>
