# Builds a signed Android APK and unsigned iOS IPA and Windows app when a version tag (v1.2.3) is
# pushed, and attaches them to a GitHub release for that tag. Secrets are listed in the README.
# A suffix (v1.0.0-beta, v1.0.0_beta) names the files and marks a pre-release; the app itself
# gets the numeric part, since iOS and Windows versions must be numbers.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload install maui-android

      - name: Publish signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          NAME="${GITHUB_REF_NAME#v}"
          VERSION="${NAME%%[-_]*}"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          dotnet publish ping-my-network.csproj -c Release -f net10.0-android -o out \
            -p:TargetFrameworks=net10.0-android \
            -p:ApplicationDisplayVersion="$VERSION" -p:ApplicationVersion=${{ github.run_number }} \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/release.keystore" \
            -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD \
            -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD
          mv out/*-Signed.apk "PingMyNetwork-$NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: PingMyNetwork-*.apk

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # .NET for iOS needs the Xcode it was built against, so both are pinned together; the
      # newest workload can need an Xcode the runner does not have yet. Bump them as a pair.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: |
          # MAUI is pinned too: left out, its manifest falls back to 10.0.0, below what SimpleShell needs.
          echo '{ "microsoft.net.sdk.ios": "26.5.10315/10.0.100", "microsoft.net.sdk.maui": "10.0.20/10.0.100" }' > "$RUNNER_TEMP/rollback.json"
          dotnet workload install maui-ios --from-rollback-file "$RUNNER_TEMP/rollback.json"

      # Unsigned: no paid Apple developer account. Sideloading tools sign it with the user's own Apple ID.
      - name: Build unsigned IPA
        run: |
          NAME="${GITHUB_REF_NAME#v}"
          VERSION="${NAME%%[-_]*}"
          dotnet build ping-my-network.csproj -c Release -f net10.0-ios -r ios-arm64 \
            -p:TargetFrameworks=net10.0-ios \
            -p:ApplicationDisplayVersion="$VERSION" -p:ApplicationVersion=${{ github.run_number }} \
            -p:EnableCodeSigning=false -p:CodesignRequireProvisioningProfile=false
          mkdir Payload
          cp -R bin/Release/net10.0-ios/ios-arm64/*.app Payload/
          zip -qry "PingMyNetwork-$NAME.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: PingMyNetwork-*.ipa

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload install maui-windows

      # Unpackaged, self-contained and unsigned (no code-signing certificate), so the zip runs without
      # installing .NET or the Windows App SDK; SmartScreen warns on first run.
      - name: Publish
        shell: pwsh
        run: |
          $version = ($env:GITHUB_REF_NAME.TrimStart('v') -split '[-_]')[0]
          dotnet publish ping-my-network.csproj -c Release -f net10.0-windows10.0.19041.0 -r win-x64 -o out `
            -p:TargetFrameworks=net10.0-windows10.0.19041.0 `
            -p:ApplicationDisplayVersion="$version" -p:ApplicationVersion=${{ github.run_number }} `
            -p:SelfContained=true -p:WindowsAppSDKSelfContained=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path out\* -DestinationPath "PingMyNetwork-$($env:GITHUB_REF_NAME.TrimStart('v'))-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: PingMyNetwork-*.zip

  release:
    needs: [android, ios, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=$([[ "$GITHUB_REF_NAME" == *[-_]* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" PingMyNetwork-* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $PRERELEASE
