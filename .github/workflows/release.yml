# Builds a signed Android APK, iOS IPA and Windows app when a version tag (v1.2.3) is pushed,
# and attaches them to a GitHub release for that tag. Secrets are listed in the README.
# A suffix (v1.0.0-beta, v1.0.0_beta) names the files and marks a pre-release; the app itself
# gets the numeric part, since iOS and Windows versions must be numbers.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload install maui-android

      - name: Publish signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          NAME="${GITHUB_REF_NAME#v}"
          VERSION="${NAME%%[-_]*}"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          dotnet publish ping-my-network.csproj -c Release -f net10.0-android -o out \
            -p:TargetFrameworks=net10.0-android \
            -p:ApplicationDisplayVersion="$VERSION" -p:ApplicationVersion=${{ github.run_number }} \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/release.keystore" \
            -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD \
            -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD
          mv out/*-Signed.apk "PingMyNetwork-$NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: PingMyNetwork-*.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload install maui-ios

      - name: Install certificate and provisioning profile
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # The signing identity and profile name are read from the files, so they need no secrets of their own.
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(plutil -extract UUID raw "$RUNNER_TEMP/profile.plist")
          for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$DIR"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$DIR/$UUID.mobileprovision"
          done
          echo "CODESIGN_PROVISION=$(plutil -extract Name raw "$RUNNER_TEMP/profile.plist")" >> "$GITHUB_ENV"
          echo "CODESIGN_KEY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n '1s/.*"\(.*\)".*/\1/p')" >> "$GITHUB_ENV"

      - name: Publish signed IPA
        run: |
          NAME="${GITHUB_REF_NAME#v}"
          VERSION="${NAME%%[-_]*}"
          dotnet publish ping-my-network.csproj -c Release -f net10.0-ios -r ios-arm64 -o out \
            -p:TargetFrameworks=net10.0-ios \
            -p:ApplicationDisplayVersion="$VERSION" -p:ApplicationVersion=${{ github.run_number }} \
            -p:ArchiveOnBuild=true \
            -p:CodesignKey="$CODESIGN_KEY" \
            -p:CodesignProvision="$CODESIGN_PROVISION"
          mv out/*.ipa "PingMyNetwork-$NAME.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: PingMyNetwork-*.ipa

      - name: Remove keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload install maui-windows

      # Unpackaged and self-contained, so the zip runs without installing .NET or the Windows App SDK.
      - name: Publish
        shell: pwsh
        run: |
          $version = ($env:GITHUB_REF_NAME.TrimStart('v') -split '[-_]')[0]
          dotnet publish ping-my-network.csproj -c Release -f net10.0-windows10.0.19041.0 -r win-x64 -o out `
            -p:TargetFrameworks=net10.0-windows10.0.19041.0 `
            -p:ApplicationDisplayVersion="$version" -p:ApplicationVersion=${{ github.run_number }} `
            -p:SelfContained=true -p:WindowsAppSDKSelfContained=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            /tr http://timestamp.digicert.com /td SHA256 out\ping-my-network.exe out\ping-my-network.dll
          $exit = $LASTEXITCODE
          Remove-Item $pfx
          exit $exit

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path out\* -DestinationPath "PingMyNetwork-$($env:GITHUB_REF_NAME.TrimStart('v'))-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: PingMyNetwork-*.zip

  release:
    needs: [android, ios, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=$([[ "$GITHUB_REF_NAME" == *[-_]* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" PingMyNetwork-* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $PRERELEASE
